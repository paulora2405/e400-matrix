[project]
name = "e400plus"
version = "0.1.0"
description = "Linux control for darkFlash EXPLORE E400 / E400 Plus matrix display"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "e400plus contributors" }]
dependencies = [
  "hidapi>=0.14",
  "psutil>=5.9",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2",
  "PyYAML>=6",
]

[dependency-groups]
dev = [
  "pytest>=8",
]

[project.scripts]
e400plus = "e400plus.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["e400plus*"]
